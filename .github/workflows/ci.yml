name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend (mvn test)
    # Repository variable CI_RUNNER=self-hosted runs this on a registered machine instead.
    runs-on: ${{ vars.CI_RUNNER || 'ubuntu-latest' }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      # ubuntu-latest ships a Docker daemon, so the *DbTest and *E2eTest suites start the
      # pgvector/pgvector:pg16 container through Testcontainers instead of skipping.
      # A self-hosted machine without Docker skips the database suites instead.
      - name: Pre-pull the test database image
        run: |
          if command -v docker >/dev/null && docker info >/dev/null 2>&1; then
            docker pull pgvector/pgvector:pg16
          else
            echo "No Docker, so the database suites will be skipped"
          fi
      - name: Run tests
        run: mvn -B -ntp test
      - name: Upload surefire reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: surefire-reports
          path: '**/target/surefire-reports/'
          retention-days: 7

  client:
    name: Client (npm run build)
    # Repository variable CI_RUNNER=self-hosted runs this on a registered machine instead.
    runs-on: ${{ vars.CI_RUNNER || 'ubuntu-latest' }}
    timeout-minutes: 15
    defaults:
      run:
        working-directory: jizza-client
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Unit and component tests
        run: npm test
      - name: Build
        run: npm run build
