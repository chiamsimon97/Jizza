# Jizza — application configuration.
#
# Nothing secret lives in this file. Every credential is an environment variable with no default,
# so a missing one fails loudly at startup rather than silently running with a placeholder.

spring:
  application:
    name: jizza
  profiles:
    default: local
  datasource:
    url: ${JIZZA_DB_URL:jdbc:postgresql://localhost:5432/jizza}
    username: ${JIZZA_DB_USER:jizza}
    password: ${JIZZA_DB_PASSWORD:jizza}
    hikari:
      maximum-pool-size: 12
      pool-name: jizza-pool
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate          # Flyway owns the schema; Hibernate only checks it matches
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
        format_sql: false
  flyway:
    enabled: true
    locations: classpath:db/migration
  mail:
    host: ${JIZZA_SMTP_HOST:localhost}
    port: ${JIZZA_SMTP_PORT:1025}
    properties:
      mail:
        smtp:
          auth: ${JIZZA_SMTP_AUTH:false}
          starttls:
            enable: ${JIZZA_SMTP_STARTTLS:false}
  threads:
    virtual:
      enabled: true
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 11MB

server:
  port: ${JIZZA_PORT:8080}
  forward-headers-strategy: framework   # correct scheme and host behind a tunnel
  error:
    include-message: never
    include-stacktrace: never

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      probes:
        enabled: true
      show-details: when-authorized
  metrics:
    tags:
      application: jizza
  # Every agent run, model call and tool call is a span (names, tiers, token counts and outcomes;
  # never prompts, arguments or replies). Spans stay in the process unless an OTLP endpoint is
  # given, e.g. MANAGEMENT_OTLP_TRACING_ENDPOINT=http://localhost:4318/v1/traces for a local
  # Jaeger or Grafana Tempo. Leave the endpoint unset here: setting it at all switches export on.
  tracing:
    sampling:
      probability: ${JIZZA_TRACE_SAMPLING:1.0}

logging:
  level:
    root: INFO
    com.jizza: INFO
  pattern:
    console: "%d{HH:mm:ss.SSS} %-5level [%X{requestId:-}] %logger{36} - %msg%n"
  structured:
    format:
      file: ecs                       # structured JSON on disk, readable text on the console
  file:
    name: ${JIZZA_LOG_FILE:./data/logs/jizza.log}

jizza:
  # Development setup. Off in production, where startup is refused without the Public organization.
  development: ${JIZZA_DEVELOPMENT:false}
  # Jizza's own Public organization: the platform's account registry, created at startup for the
  # Super Admin. Every account is registered in it; people join only when made Admin or Developer.
  public-organization:
    name: ${JIZZA_PUBLIC_ORG_NAME:Jizza Public}
  security:
    # Key resolution order: keystore, then key file, then (development only) an environment key.
    keystore-path: ${JIZZA_KEYSTORE_PATH:}
    keystore-password: ${JIZZA_KEYSTORE_PASSWORD:}
    keystore-alias: jizza-master
    master-key-file: ${JIZZA_MASTER_KEY_FILE:${user.home}/.jizza/master.key}
    master-key: ${JIZZA_MASTER_KEY:}
    allow-env-master-key: true
    session:
      idle-timeout: 3d                # signed out after 3 days with no activity
      absolute-timeout: 15d           # and always asked to sign in again after 15 days
      cookie-name: JIZZA_SESSION
      cookie-secure: ${JIZZA_COOKIE_SECURE:false}   # true wherever TLS terminates in front
      same-site: Strict
    step-up:
      freshness: 15m                  # how long one password confirmation unlocks sensitive actions
      max-failures: 5                 # wrong step-up answers in a row before the session is revoked
    mfa:
      # Jizza holds memory, personal data and live credentials, so every account must use an
      # authenticator app. Until it is set up, a signed-in session can only reach the setup screens.
      required: ${JIZZA_MFA_REQUIRED:true}
      recovery-codes: 8
    smart-sign-in:
      # Sign a browser in by scanning the QR on the login page with a phone already signed in to
      # Jizza (its browser, or the Jizza Agent app). Each code works once.
      enabled: ${JIZZA_SMART_SIGN_IN:true}
      lifetime: 2m
    registration:
      # Single-user: once the owner's account exists, nobody else can register.
      allow-additional-users: ${JIZZA_ALLOW_ADDITIONAL_USERS:false}
    super-admin:
      # The product owner's account. At startup it gets the super admin role (full access in every
      # account, every use audited); everyone else loses it. Blank: nobody holds it.
      email: ${JIZZA_SUPER_ADMIN_EMAIL:}
    invitations:
      expiry: 7d                      # how long a membership request stays open
      per-workspace-per-hour: 20
      # Where the app is served, for the sign-up link in invitation emails.
      client-base-url: ${JIZZA_CLIENT_BASE_URL:http://localhost:5173}
    lockout:
      max-failed-attempts: 5
      lockout-duration: 15m
      auth-requests-per-minute: 20
    totp:
      issuer: Jizza
      digits: 6
      period-seconds: 30
      skew-steps: 1
    cors:
      allowed-origins: ${JIZZA_CORS_ORIGINS:http://localhost:5173}
      # Browser-extension agents (Chrome, Edge, Ulaa...) call /agent/v1/** from their own origin.
      agent-origin-patterns: ${JIZZA_AGENT_ORIGIN_PATTERNS:chrome-extension://*}

  agents:
    anthropic:
      base-url: ${ANTHROPIC_BASE_URL:https://api.anthropic.com}
      api-key: ${ANTHROPIC_API_KEY:}
      version: "2023-06-01"
      timeout: ${JIZZA_LLM_TIMEOUT:300s}
      # Newer models think before they answer, and that thinking counts against this cap, so it
      # leaves room for a long reply or a big workflow draft. Replies stream, so a long one is fine.
      max-output-tokens: ${JIZZA_LLM_MAX_OUTPUT_TOKENS:16000}
      # A call that failed for a passing reason (rate limited, overloaded, a dropped connection)
      # is tried again with backoff, honouring the provider's retry-after.
      retry:
        max-attempts: ${JIZZA_LLM_MAX_ATTEMPTS:4}
        initial-backoff: 1s
        max-backoff: 20s
        max-retry-after: 60s
      # Tool definitions and each agent's instructions are cached by the provider, and so is the
      # conversation inside a tool loop. Turn off only for a proxy that rejects cache_control.
      caching:
        enabled: ${JIZZA_LLM_PROMPT_CACHING:true}
      # Each paired browser offers about forty actions and an MCP server can offer dozens of tools.
      # Once these add up to min-chars of definitions, they are left out of each request and the
      # model finds the ones it needs with the provider's tool search.
      tool-search:
        enabled: ${JIZZA_LLM_TOOL_SEARCH:true}
        min-chars: 30000
      # What changes from turn to turn (memory for this request, the workspace summary, a thread's
      # guide) goes after the person's message instead of before the conversation, so the
      # conversation is read from the cache on the next turn. Only for the models listed.
      inline-context:
        enabled: ${JIZZA_LLM_INLINE_CONTEXT:true}
        models: [claude-opus-4-8, claude-opus-5, claude-sonnet-5-5, claude-haiku-5, claude-fable, claude-mythos]
      # Searching the web and reading pages, with the provider's own tools. Each agent can have it
      # turned off on its page. Sites in blocked-domains are never searched or read (plain host
      # names, comma separated, subdomains included). Each search is billed by the provider.
      web:
        enabled: ${JIZZA_WEB_TOOLS:true}
        max-searches: ${JIZZA_WEB_MAX_SEARCHES:5}
        max-fetches: ${JIZZA_WEB_MAX_FETCHES:5}
        max-page-tokens: 20000
        blocked-domains: ${JIZZA_WEB_BLOCKED_DOMAINS:}
      # How hard each tier thinks (low, medium, high, xhigh, max; blank = the model's default).
      # Quick turns stay quick; Jizza's usual turns call several tools, which medium suits.
      effort:
        routing: ${JIZZA_EFFORT_ROUTING:low}
        standard: ${JIZZA_EFFORT_STANDARD:medium}
        deep: ${JIZZA_EFFORT_DEEP:high}
    # Model tiering: a cheap model routes, a stronger one does the hard work. Configuration, never
    # a literal, because model names change.
    models:
      routing: ${JIZZA_MODEL_ROUTING:claude-haiku-5-5}
      standard: ${JIZZA_MODEL_STANDARD:claude-sonnet-5-5}
      deep: ${JIZZA_MODEL_DEEP:claude-opus-5-5}
    # Jizza's simple turns (a greeting, a quick question, a hand-off to one specialist) run on the
    # routing model, chosen by a short check on that model; everything else stays on standard.
    routing:
      enabled: ${JIZZA_CHEAP_ROUTING:true}
      max-simple-chars: 600
    # US dollars per million tokens. Cache reads are a share of the input price (0.1 unless set).
    # Older models stay listed so earlier usage and an overridden tier are still priced.
    pricing:
      claude-haiku-5-5:
        input-per-million: 0.10
        output-per-million: 0.50
      claude-sonnet-5-5:
        input-per-million: 2.0
        output-per-million: 10.0
        cache-read-multiplier: 0.05
      claude-opus-5-5:
        input-per-million: 4.0
        output-per-million: 20.0
        cache-read-multiplier: 0.05
      claude-haiku-4-5-20251001:
        input-per-million: 1.0
        output-per-million: 5.0
      claude-sonnet-5:
        input-per-million: 2.0
        output-per-million: 10.0
      claude-opus-5:
        input-per-million: 5.0
        output-per-million: 25.0
    loop:
      max-tool-iterations: 8
      max-tokens-per-run: 120000
      max-tool-result-chars: 20000
    budget:
      per-window-units: ${JIZZA_LLM_BUDGET:5.0}
      window: 24h

  # MCP servers whose tools agents may use. Each tool reaches the model as mcp_<server>__<tool>
  # and runs through the Capability Registry like any other: kill switch, guardrails, audit.
  # Only the agents named under `agents` see a server. A tool not listed under `action-types` is
  # treated as moving money, so it asks every time; the server's own claims are not trusted.
  # mcp:
  #   servers:
  #     notes:
  #       transport: stdio
  #       command: npx
  #       args: [-y, "@modelcontextprotocol/server-filesystem", /Users/me/Notes]
  #       agents: [jizza, professional]
  #       tools: [read_text_file, list_directory, search_files]
  #       action-types:
  #         read_text_file: read
  #         list_directory: read
  #         search_files: read
  #     docs:
  #       transport: http
  #       url: http://localhost:3333/mcp
  #       headers:
  #         Authorization: Bearer ${DOCS_MCP_TOKEN}
  #       agents: [professional]

  # Embeddings for knowledge and memory. "local" is offline hashing (lexical similarity, nothing
  # leaves the machine). "openai-compatible" calls any /v1/embeddings endpoint; a local Ollama
  # (ollama pull nomic-embed-text) gives real semantic search and still stays on this machine.
  # Switching provider is safe: memory facts are re-embedded in the background.
  embedding:
    provider: ${JIZZA_EMBEDDING_PROVIDER:local}
    openai-compatible:
      base-url: ${JIZZA_EMBEDDING_BASE_URL:http://localhost:11434/v1}
      api-key: ${JIZZA_EMBEDDING_API_KEY:}
      model: ${JIZZA_EMBEDDING_MODEL:nomic-embed-text}
      timeout: 30s

  # Hybrid memory: what Jizza knows about the user and the people, accounts and plans in their
  # life, handed to every agent turn. See docs/MEMORY.md.
  memory:
    enabled: true
    # Development only: fills these accounts' (comma-separated emails) memory with a sample, once,
    # while they remember nothing. Off by default.
    sample:
      seed-email: ${JIZZA_SAMPLE_MEMORY_EMAIL:}
    # Which specialist domains see a category; unlisted categories are shared with every agent.
    category-domains:
      finance: [finance]
      health: [health]
      professional: [professional]
    orchestrator-sees-all-domains: false
    retrieval:
      max-items: 12
      max-chars: 4000
      candidate-limit: 30
      min-similarity: 0.2
      min-score: 0.35
      pinned-importance: 0.9
      pinned-limit: 5
      recency-half-life: 90d
      relation-depth: 1
    write:
      duplicate-similarity: 0.95
      max-content-chars: 2000
    extraction:
      enabled: ${JIZZA_MEMORY_LEARNING:true}
      tier: routing
      min-confidence: 0.7
      max-facts-per-turn: 8
    retention:
      inactive: 180d

  connectors:
    # Providers redirect here, so it must be reachable from the internet. In local development that
    # means a tunnel (ngrok / cloudflared) or a provider that permits http://localhost.
    callback-base-url: ${JIZZA_CALLBACK_BASE_URL:http://localhost:8080}
    callback-path: /api/oauth/callback
    state-ttl: 10m
    refresh-skew: 2m
    http:
      connect-timeout: 10s
      read-timeout: 30s
      max-response-bytes: 2097152
    egress:
      allow-private-networks: false
      allow-plain-http: false
      allow-hosts: ${JIZZA_EGRESS_ALLOW_HOSTS:}

  scheduler:
    enabled: true
    default-timezone: ${JIZZA_TIMEZONE:Asia/Kolkata}
    default-catch-up-policy: run_once
    poll-interval: 20s
    stale-run-after: 30m

  # Workflow runs. Ready HTTP, connector, MCP, agent and script steps on parallel paths run at the
  # same time, up to max-concurrent-steps per run (1 runs them one after another). A Join stops
  # waiting default-timeout after the first path reaches it, unless the step sets its own.
  workflow:
    parallel:
      max-concurrent-steps: ${JIZZA_WORKFLOW_MAX_CONCURRENT_STEPS:8}
    join:
      default-timeout: ${JIZZA_WORKFLOW_JOIN_TIMEOUT:PT1H}

  notifications:
    permission-expiry: 24h
    review-expiry: 7d
    instruction-expiry: 48h
    remind-when-within: 4h
    reminder-cooldown: 2h
    max-reminders: 3
    email-escalation: true
    sweep-interval: 5m

  # Paired devices. Push wakes a phone whose app is closed; without it phones pick up work when
  # they next check in. JIZZA_FCM_CREDENTIALS is the path to the Firebase service account key
  # (a JSON file kept outside the repository). See docs/agent-protocol-v1.md section 8.
  devices:
    push:
      fcm:
        credentials-file: ${JIZZA_FCM_CREDENTIALS:}
      # Apple push for the iPhone app: the APNs auth key (.p8) from the Apple Developer account,
      # its key id, the team id and the app's bundle id. Sandbox for apps installed from Xcode.
      apns:
        key-file: ${JIZZA_APNS_KEY_FILE:}
        key-id: ${JIZZA_APNS_KEY_ID:}
        team-id: ${JIZZA_APNS_TEAM_ID:}
        topic: ${JIZZA_APNS_TOPIC:com.jizza.ios}
        sandbox: ${JIZZA_APNS_SANDBOX:false}

  # Web automation. Both options are off until turned on; see docs/web-automation.md.
  webauto:
    ai-fix-ranking: ${JIZZA_WEBAUTO_AI_FIX_RANKING:false}
    fast-replay: ${JIZZA_WEBAUTO_FAST_REPLAY:false}

  # Kai's Portfolio tab (family finance planning). Off until the feature is ready: while off,
  # /api/finance/** does not exist and the tab stays hidden. See docs/kai-handoff/.
  finance:
    enabled: ${JIZZA_FINANCE_ENABLED:false}

  platform:
    queue:
      enabled: true
      batch-size: 10
      max-attempts: 5
      lease-duration: 5m
      poll-interval: 2s
    storage:
      root: ${JIZZA_STORAGE_ROOT:./data/storage}
    mail:
      from: ${JIZZA_MAIL_FROM:jizza@localhost}
      enabled: true
    files:
      max-bytes: 10485760        # per uploaded file, including agent memory files
    retention:
      conversation-history: 365d

---
# The default profile: one process serving the API and running the worker.
spring:
  config:
    activate:
      on-profile: local

---
# Worker-only: no HTTP surface, everything else identical. For adding worker processes later.
spring:
  config:
    activate:
      on-profile: worker
  main:
    web-application-type: none

jizza:
  scheduler:
    enabled: true
  platform:
    queue:
      enabled: true
